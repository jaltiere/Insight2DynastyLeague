# Nixpacks configuration for Railway backend service
# root_dir=backend, so this file must live in backend/

[phases.setup]
nixPkgs = ["python311", "gcc", "libmysqlclient"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt"]

[start]
cmd = "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
