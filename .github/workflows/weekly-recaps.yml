name: Generate Weekly Recaps and Predictions

on:
  schedule:
    # Tuesday at 10 AM UTC (after games are final)
    - cron: '0 10 * * 2'
    # Thursday at 14:00 UTC (lineup updates). Thursday is only the usual first
    # game day, not a guaranteed one - 2026 Week 1 opens on a Wednesday - so
    # this run is gated on the schedule below, matching SyncService.
    - cron: '0 14 * * 4'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-recaps:
    runs-on: ubuntu-latest

    steps:
      - name: Check NFL season status
        id: nfl
        run: |
          set -euo pipefail
          # Get current NFL state from Sleeper API
          NFL_STATE=$(curl -sS -f https://api.sleeper.app/v1/state/nfl)
          SEASON_TYPE=$(echo "$NFL_STATE" | jq -r '.season_type // "off"')
          WEEK=$(echo "$NFL_STATE" | jq -r '.week // 0')
          SEASON=$(echo "$NFL_STATE" | jq -r '.season // "2025"')

          echo "season_type=$SEASON_TYPE" >> $GITHUB_OUTPUT
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "season=$SEASON" >> $GITHUB_OUTPUT
          echo "NFL Season Type: $SEASON_TYPE, Week: $WEEK, Season: $SEASON"

          # "pre" is not a playable week: Sleeper reports preseason as week 1
          # with matchups that have never been played.
          if [ "$SEASON_TYPE" = "off" ] || [ "$SEASON_TYPE" = "pre" ] || [ "$WEEK" = "0" ]; then
            echo "is_active=false" >> $GITHUB_OUTPUT
            echo "is_first_game_day=false" >> $GITHUB_OUTPUT
            echo "⏸️ No NFL games in progress ($SEASON_TYPE) - skipping recap generation"
            exit 0
          fi

          echo "is_active=true" >> $GITHUB_OUTPUT
          echo "🏈 NFL season is active - proceeding with recap generation"

          # Is today the morning of this week's first game? Predictions are
          # refreshed then so they reflect final lineups. Sleeper's schedule
          # route lives outside /v1 and its dates are US Eastern calendar
          # dates, so "today" is evaluated in Eastern time too. A lookup
          # failure yields false, so an outage never causes a stale-data
          # regeneration - the same fallback SyncService uses.
          TODAY=$(TZ=America/New_York date +%F)
          FIRST_GAME=$(curl -sS -f "https://api.sleeper.app/schedule/nfl/regular/$SEASON" \
            | jq -r --argjson wk "$WEEK" \
              '[.[] | select(.week == $wk and .date != null) | .date] | min // ""' \
            || echo "")

          if [ -n "$FIRST_GAME" ] && [ "$FIRST_GAME" = "$TODAY" ]; then
            echo "is_first_game_day=true" >> $GITHUB_OUTPUT
            echo "🏟️ Today ($TODAY) is week $WEEK's first game day"
          else
            echo "is_first_game_day=false" >> $GITHUB_OUTPUT
            echo "📅 Today is $TODAY; week $WEEK opens ${FIRST_GAME:-unknown}"
          fi

      - name: Discover leagues
        id: leagues
        if: steps.nfl.outputs.is_active == 'true'
        run: |
          set -euo pipefail
          # Read slugs from the API so this stays in sync with leagues.json.
          # Leagues with recaps disabled self-skip server side.
          SLUGS=$(curl -sS -f https://api.insight2dynasty.com/api/leagues | jq -r '.[].slug' | tr '\n' ' ')
          if [ -z "$(echo "$SLUGS" | tr -d '[:space:]')" ]; then
            echo "::error::No league slugs returned by /api/leagues"
            exit 1
          fi
          echo "slugs=$SLUGS" >> $GITHUB_OUTPUT
          echo "Leagues: $SLUGS"

      - name: Generate recaps (Tuesday only)
        if: steps.nfl.outputs.is_active == 'true' && github.event.schedule == '0 10 * * 2'
        run: |
          set -uo pipefail
          WEEK=${{ steps.nfl.outputs.week }}
          SEASON=${{ steps.nfl.outputs.season }}

          # Week 1 has no completed week behind it. Without this the step calls
          # regenerate/0, which succeeds with zero recaps and buries the real
          # week-1 result in the log.
          if [ "$WEEK" -lt 2 ]; then
            echo "⏭️ Week $WEEK has no previous week to recap - skipping"
            exit 0
          fi

          PREV_WEEK=$((WEEK - 1))
          FAILED=""
          for SLUG in ${{ steps.leagues.outputs.slugs }}; do
            echo "Generating week $PREV_WEEK recaps for $SLUG..."
            curl -sS -f -X POST \
              "https://api.insight2dynasty.com/api/$SLUG/matchup-recaps/regenerate/$PREV_WEEK?season=$SEASON" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || FAILED="$FAILED $SLUG"
            echo
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Recap generation failed for:$FAILED"
            exit 1
          fi

      # Tuesday seeds the week's predictions; the first-game-day run refreshes
      # them against final lineups. The Thursday cron is skipped when Thursday
      # is not the opener, so predictions are never rewritten after kickoff.
      - name: Generate predictions (Tuesday and first game day)
        if: >-
          steps.nfl.outputs.is_active == 'true' &&
          (github.event.schedule == '0 10 * * 2' ||
           github.event_name == 'workflow_dispatch' ||
           steps.nfl.outputs.is_first_game_day == 'true')
        run: |
          set -uo pipefail
          WEEK=${{ steps.nfl.outputs.week }}
          SEASON=${{ steps.nfl.outputs.season }}
          FAILED=""
          for SLUG in ${{ steps.leagues.outputs.slugs }}; do
            echo "Generating week $WEEK predictions for $SLUG..."
            curl -sS -f -X POST \
              "https://api.insight2dynasty.com/api/$SLUG/matchup-recaps/regenerate-predictions/$WEEK?season=$SEASON" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || FAILED="$FAILED $SLUG"
            echo
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Prediction generation failed for:$FAILED"
            exit 1
          fi

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.nfl.outputs.is_active }}" != "true" ]; then
            echo "⏸️ Skipped - no NFL games in progress (${{ steps.nfl.outputs.season_type }})"
          elif [ "${{ github.event.schedule }}" = "0 14 * * 4" ] \
            && [ "${{ steps.nfl.outputs.is_first_game_day }}" != "true" ]; then
            echo "⏸️ Skipped - this week opened before today, so predictions"
            echo "   would be rewritten after kickoff"
          else
            echo "✅ Recap generation workflow completed"
          fi
          echo "Day: $(TZ=America/New_York date +'%A %F') (US Eastern)"
          echo "Season Type: ${{ steps.nfl.outputs.season_type }}"
          echo "Week: ${{ steps.nfl.outputs.week }}"
          echo "First game day: ${{ steps.nfl.outputs.is_first_game_day }}"
