name: Generate Weekly Recaps and Predictions

on:
  schedule:
    # Tuesday at 10 AM UTC (after games are final)
    - cron: '0 10 * * 2'
    # Thursday at 14 AM UTC (lineup updates)
    - cron: '0 14 * * 4'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-recaps:
    runs-on: ubuntu-latest

    steps:
      - name: Check NFL season status
        id: nfl
        run: |
          # Get current NFL state from Sleeper API
          NFL_STATE=$(curl -s https://api.sleeper.app/v1/state/nfl)
          SEASON_TYPE=$(echo "$NFL_STATE" | jq -r '.season_type // "off"')
          WEEK=$(echo "$NFL_STATE" | jq -r '.week // 0')
          SEASON=$(echo "$NFL_STATE" | jq -r '.season // "2025"')

          echo "season_type=$SEASON_TYPE" >> $GITHUB_OUTPUT
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "season=$SEASON" >> $GITHUB_OUTPUT
          echo "NFL Season Type: $SEASON_TYPE, Week: $WEEK, Season: $SEASON"

          if [ "$SEASON_TYPE" = "off" ] || [ "$WEEK" = "0" ]; then
            echo "is_offseason=true" >> $GITHUB_OUTPUT
            echo "⏸️ NFL is in offseason - skipping recap generation"
          else
            echo "is_offseason=false" >> $GITHUB_OUTPUT
            echo "🏈 NFL season is active - proceeding with recap generation"
          fi

      - name: Generate recaps (Tuesday only)
        if: steps.nfl.outputs.is_offseason == 'false' && github.event.schedule == '0 10 * * 2'
        run: |
          WEEK=${{ steps.nfl.outputs.week }}
          PREV_WEEK=$((WEEK - 1))
          echo "Generating recaps for week $PREV_WEEK..."

          curl -X POST "https://api.insight2dynasty.com/api/matchup-recaps/regenerate/$PREV_WEEK" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f || echo "Failed to generate recaps"

      - name: Generate predictions (Tuesday and Thursday)
        if: steps.nfl.outputs.is_offseason == 'false'
        run: |
          WEEK=${{ steps.nfl.outputs.week }}
          SEASON=${{ steps.nfl.outputs.season }}
          echo "Generating predictions for week $WEEK..."

          curl -X POST "https://api.insight2dynasty.com/api/matchup-recaps/regenerate-predictions/$WEEK?season=$SEASON" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f || echo "Failed to generate predictions"

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.nfl.outputs.is_offseason }}" = "true" ]; then
            echo "⏸️ Skipped - NFL is in offseason (${{ steps.nfl.outputs.season_type }})"
          else
            echo "✅ Recap generation workflow completed"
          fi
          echo "Day: $(date +%A)"
          echo "Season Type: ${{ steps.nfl.outputs.season_type }}"
          echo "Week: ${{ steps.nfl.outputs.week }}"
